name: Firestore Rules CI

on:
  push:
    branches:
      - main
      - feature/source-agnostic-player-data
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - test/rules/**
      - .github/workflows/firestore_rules_ci.yml
  pull_request:
    branches:
      - main
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - test/rules/**
      - .github/workflows/firestore_rules_ci.yml

permissions:
  contents: read

concurrency:
  group: firestore-rules-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/rules/package-lock.json

      - name: Install rule test dependencies
        working-directory: test/rules
        run: npm ci

      - name: Run Firestore rules emulator tests
        run: >-
          ./test/rules/node_modules/.bin/firebase
          emulators:exec
          --project demo-asta-matrix-rules
          --only firestore
          "node --test test/rules/firestore.rules.test.mjs"
