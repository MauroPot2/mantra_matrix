name: Android Release Build CI

on:
  push:
    branches:
      - main
      - feature/source-agnostic-player-data
    paths:
      - lib/**
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/android_release_ci.yml
  pull_request:
    branches:
      - main
    paths:
      - lib/**
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/android_release_ci.yml

permissions:
  contents: read

concurrency:
  group: android-release-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-pub
