name: Sync Flutter Lockfile

on:
  push:
    branches:
      - feature/source-agnostic-player-data
    paths:
      - pubspec.yaml
      - .github/workflows/sync_lockfile.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/source-agnostic-player-data

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo 'pubspec.lock is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'sync flutter dependency lock [skip ci]'
          git push origin HEAD:feature/source-agnostic-player-data
