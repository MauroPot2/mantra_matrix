name: PR Analyzer Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-analyzer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment analyzer failure
        if: steps.analyze.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Asta Matrix analyzer diagnostics'
            echo
            echo '```text'
            tail -n 120 analyze.log
            echo '```'
          } > analyzer-comment.md
          gh pr comment "$PR_NUMBER" --body-file analyzer-comment.md

      - name: Fail on analyzer errors
        if: steps.analyze.outputs.exit_code != '0'
        run: exit 1
